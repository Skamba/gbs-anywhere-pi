# comitup settings for the gbs-anywhere image. See comitup.conf(5).

# The setup Wi-Fi the Pi opens when it can't join a network. It is open, so
# no password is baked into the image; it exists only while the Pi has no
# network.
ap_name: gbs-anywhere-<nnn>

# Stopped while the setup Wi-Fi is up (its page uses port 80, as does the
# app) and started once the Pi is on a network.
web_service: gbs-anywhere.service

# With a second Wi-Fi adapter comitup would keep the open setup Wi-Fi up
# for good and share the connection through it.
enable_appliance_mode: false
