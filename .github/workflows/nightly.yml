# Builds a nightly image from gbs-anywhere's main: every night, and on a
# manual run, if main has a commit no nightly was built from yet. The
# package is built here with gbs-anywhere's own packaging/build-release.sh,
# then the image is published as an untested pre-release, never as latest.
# Only the newest 7 nightlies are kept.
name: Nightly image

on:
  schedule:
    # After gbs-anywhere's own nightly (02:23 UTC).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      skip: ${{ steps.upstream.outputs.skip }}
      stamp: ${{ steps.info.outputs.stamp }}
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      name: ${{ steps.info.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find gbs-anywhere's main
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r sha date < <(gh api repos/Skamba/gbs-anywhere/commits/main --jq '"\(.sha) \(.commit.committer.date)"')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "unexpected commit: $sha" >&2
            exit 1
          fi
          echo "main is at $sha, committed $date"
          {
            echo "sha=$sha"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
          # A variable, not a pipe: grep -q would stop reading early, and the
          # pipe's failure would look like "no nightly yet".
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          if grep -Eq "^nightly-[0-9]{8}-${sha:0:7}\$" <<< "$tags"; then
            echo "A nightly of ${sha:0:7} exists already; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.upstream.outputs.skip != 'true'
        with:
          repository: Skamba/gbs-anywhere
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          persist-credentials: false
      - name: Name the nightly
        id: info
        if: steps.upstream.outputs.skip != 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          DATE: ${{ steps.upstream.outputs.date }}
        run: scripts/nightly-info.sh upstream/Cargo.toml "$SHA" "$DATE" | tee -a "$GITHUB_OUTPUT"
      - name: Build the package with gbs-anywhere's script
        if: steps.upstream.outputs.skip != 'true'
        env:
          GBS_COMMIT: ${{ steps.upstream.outputs.sha }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          export DEB_VERSION="$VERSION-1"
          # build-release.sh unchanged, then the same binary packaged again
          # with the nightly's version.
          docker run --rm -v "$PWD/upstream:/src" -w /src -e GBS_COMMIT -e DEB_VERSION rust:1-bookworm \
            sh -c 'sh packaging/build-release.sh && cargo deb --no-build --locked --deb-version "$DEB_VERSION"'
          deb="upstream/target/debian/gbs-anywhere_${DEB_VERSION}_arm64.deb"
          got=$(dpkg-deb -f "$deb" Version)
          if [ "$got" != "$DEB_VERSION" ]; then
            echo "$deb has version $got, not $DEB_VERSION" >&2
            exit 1
          fi
      - name: Install tools
        if: steps.upstream.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xz-utils
      - name: Disk space before
        if: steps.upstream.outputs.skip != 'true'
        run: df -h /
      - name: Build image
        if: steps.upstream.outputs.skip != 'true'
        env:
          STAMP: ${{ steps.info.outputs.stamp }}
          VERSION: ${{ steps.info.outputs.version }}
        run: scripts/build-image.sh --nightly "$STAMP" "upstream/target/debian/gbs-anywhere_${VERSION}-1_arm64.deb"
      - name: Disk space after
        if: always() && steps.upstream.outputs.skip != 'true'
        run: df -h /
      - name: Keep pi-gen's log of a failed build
        if: failure()
        # pi-gen works inside its container; the container's output is its log.
        run: |
          mkdir -p deploy
          docker logs --timestamps pigen_work > deploy/build-docker-failed.log 2>&1 || true
      - name: Check image
        if: steps.upstream.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.info.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
        run: sudo scripts/check-image.sh "deploy/$NAME.img.xz" "$VERSION"
      - name: Imager manifest, release notes, icon and package
        if: steps.upstream.outputs.skip != 'true'
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
          VERSION: ${{ steps.info.outputs.version }}
          TAG: ${{ steps.info.outputs.tag }}
          NAME: ${{ steps.info.outputs.name }}
        run: |
          deb="upstream/target/debian/gbs-anywhere_${VERSION}-1_arm64.deb"
          curl -fsSL --retry 3 -o build/os_list.json https://downloads.raspberrypi.com/os_list_imagingutility_v4.json
          scripts/make-manifest.sh --image "deploy/$NAME.img.xz" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --date "$(date -u +%F)" --official build/os_list.json > deploy/gbs-anywhere-nightly.rpi-imager-manifest
          deb_sha=$(sha256sum "$deb" | cut -d' ' -f1)
          scripts/nightly-notes.sh --version "$VERSION" --tag "$TAG" --commit "$SHA" --deb-sha256 "$deb_sha" \
            --pi-gen-tag "$(cat PI_GEN_TAG)" --repo "$GITHUB_REPOSITORY" > deploy/release-notes.md
          cp imager/icon.png deploy/gbs-anywhere-icon.png
          cp "$deb" deploy/
          ls -la deploy
      - name: Keep the image for 3 days
        if: always() && steps.upstream.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-image
          path: deploy/
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore

  release:
    needs: image
    if: needs.image.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-image
          path: deploy
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.image.outputs.stamp }}
          VERSION: ${{ needs.image.outputs.version }}
          TAG: ${{ needs.image.outputs.tag }}
          NAME: ${{ needs.image.outputs.name }}
        working-directory: deploy
        run: |
          files=("$NAME.img.xz" gbs-anywhere-nightly.rpi-imager-manifest gbs-anywhere-icon.png "$NAME.info"
            "gbs-anywhere_${VERSION}-1_arm64.deb")
          if [ -f "$NAME.sbom.xz" ]; then
            files+=("$NAME.sbom.xz")
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "gbs-anywhere nightly $STAMP image" --notes-file release-notes.md \
            "${files[@]}" SHA256SUMS
      - name: Delete all but the newest 7 nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' |
            scripts/old-nightlies.sh 7 |
            while read -r tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
